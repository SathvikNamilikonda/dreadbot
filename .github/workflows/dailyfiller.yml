name: Daily Commit Keeper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "SathvikNamilikonda"
          git config user.email "namlikondasathvik@gmail.com"

      - name: Update file
        run: |
          echo "- $(date)" >> daily-log.md

      - name: Commit
        run: |
          git add daily-log.md
          git commit -m "Testing contribution"

      - name: Push
        run: |
          git push

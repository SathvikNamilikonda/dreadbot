name: Daily Commit Keeper

on:
  schedule:
    # Every day at 2:00 PM IST
    - cron: "30 8 * * *"

  # Allows manual testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "SathvikNamilikonda"
          git config user.email "namlikondasathvik@gmail.com"

      - name: Update daily log
        run: |
          echo "- $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> daily-log.md

      - name: Commit changes
        run: |
          git add daily-log.md
          git commit -m "chore: daily repository update"

      - name: Push changes
        run: |
          git push
